name: Update official transit fares

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fares:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check official fare sources
        run: node scripts/update-fares.mjs

      - name: Commit fare changes
        shell: bash
        run: |
          if git diff --quiet -- data/fares.json; then
            echo "No fare changes."
            exit 0
          fi
          git config user.name "fare-updater[bot]"
          git config user.email "fare-updater[bot]@users.noreply.github.com"
          git add data/fares.json
          git commit -m "chore: update official public-transport fares"
          git push
