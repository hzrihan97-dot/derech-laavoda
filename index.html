<script>

    {max:15,price:8,label:'0–15'},
    {max:40,price:14.5,label:'15–40'},
    {max:75,price:19,label:'40–75'},
    {max:120,price:19,label:'75–120'},
    {max:225,price:30.5,label:'120–225'},
    {max:Infinity,price:87.32,label:'225+'}
  ];
  let monthlyRates={nationalUpTo225:315,nationalOver225:684,zone1:139};

  function validFareConfig(cfg){
    if(!cfg||!Array.isArray(cfg.singleRide)||cfg.singleRide.length!==6||!cfg.monthly)return false;
    const ps=cfg.singleRide.map(x=>Number(x.price));
    return ps.every(Number.isFinite)&&ps[0]>0&&ps[0]<=ps[1]&&ps[1]<=ps[2]&&ps[2]<=ps[3]&&ps[3]<=ps[4]&&ps[4]<ps[5]
      &&Number(cfg.monthly.nationalUpTo225)>0&&Number(cfg.monthly.nationalOver225)>=Number(cfg.monthly.nationalUpTo225)&&Number(cfg.monthly.zone1)>0;
  }

  async function loadFareConfig(){
    try{
      const res=await fetch('./data/fares.json',{cache:'no-store'});
      if(!res.ok)throw new Error('fare config');
      const cfg=await res.json();
      if(!validFareConfig(cfg))throw new Error('invalid fare config');
      const labels=['0–15','15–40','40–75','75–120','120–225','225+'];
      const maxes=[15,40,75,120,225,Infinity];
      fares=cfg.singleRide.map((x,i)=>({max:maxes[i],price:Number(x.price),label:labels[i]}));
      monthlyRates={
        nationalUpTo225:Number(cfg.monthly.nationalUpTo225),
        nationalOver225:Number(cfg.monthly.nationalOver225),
        zone1:Number(cfg.monthly.zone1)
      };
      if(Number(cfg.vat)>1)VAT=Number(cfg.vat);
      window.__fareConfig=cfg;
    }catch(e){
      console.warn('Using built-in verified fare fallback.',e);
    }
  }

      return {d,score:exact+place-i*.01};
    }).sort((x,y)=>y.score-x.score)[0].d;
    return {lat:Number(scored.lat),lon:Number(scored.lon),name:(scored.display_name||q).split(',').slice(0,3).join(', '),display_name:scored.display_name||q,address:scored.address||{},type:scored.type||'',osm_id:scored.osm_id};
  }

  function boundaryInfo(km){
    const boundaries=[15,40,75,120,225];
    const near=boundaries.find(b=>Math.abs(km-b)<=1.0);
    return near?`המרחק שחושב (${km.toFixed(1)} ק״מ) קרוב לגבול תעריף של ${near} ק״מ. לדיוק מרבי מומלץ להזין כתובת או תחנת עלייה/ירידה מדויקת.`:null;
  }
  function setLoading(on){calc.disabled=on;calc.classList.toggle('loading',on);$('.btn-text').textContent=on?'מחשב את המחיר…':'חשב מחיר נסיעה';}
  function showError(msg){error.textContent=msg;error.style.display='block';result.style.display='none';}
  function hideError(){error.style.display='none';}

  async function calculate(){
    const a=from.value.trim(),b=to.value.trim();if(!a||!b){showError('צריך למלא גם מקום מוצא וגם יעד.');return;}
    hideError();setLoading(true);
    try{
      const [ga,gb]=await Promise.all([geocode(a),geocode(b)]);if(!ga||!gb){showError('לא הצלחנו לזהות אחד המקומות. נסה לכתוב יישוב או כתובת מלאה יותר.');return;}
      const km=haversine(ga,gb),fare=fareForKm(km),za=detectZone(ga,a),zb=detectZone(gb,b),eilat=isEilatTouch(za,zb);
      let oneWay=fare.price;
      // נסיעות אל אילת/בתוך אילת/מאילת מנוכות ממע"מ. אזור 901 משמש זיהוי שמרני לליבת אילת.
      if(eilat) oneWay=trunc2(oneWay/VAT);
      const roundTrip=trunc2(oneWay*2);

      $('#fromName').textContent=(ga.name||a).split(',')[0].trim();$('#toName').textContent=(gb.name||b).split(',')[0].trim();$('#oneWay').textContent=money(oneWay);$('#roundTrip').textContent=money(roundTrip);

      const z1=zone1Eligibility(za,zb,km);
      let monthlyPrice, monthlyType;
      if(z1.eligible){
        monthlyPrice=(z1.zone==='901')?trunc2(monthlyRates.zone1/VAT):monthlyRates.zone1;
        monthlyType='חופשי אזור 1';
      }else{
        monthlyPrice=km>225?monthlyRates.nationalOver225:monthlyRates.nationalUpTo225;
        monthlyType='חופשי ארצי';
      }
      $('#monthlyPrice').textContent=money(monthlyPrice);
      $('#monthlyType').textContent=monthlyType;
      result.style.display='block';result.classList.remove('show');void result.offsetWidth;result.classList.add('show');result.scrollIntoView({behavior:'smooth',block:'nearest'});
    }catch(e){showError('לא הצלחנו להתחבר לשירות איתור הכתובות כרגע. בדוק שיש חיבור לאינטרנט ונסה שוב.');}
    finally{setLoading(false);}
  }

  calc.addEventListener('click',calculate);[from,to].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')calculate();}));swap.addEventListener('click',()=>{const tmp=from.value;from.value=to.value;to.value=tmp;result.style.display='none';hideError();from.focus();});
  if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

  // בדיקות עצמיות שקטות; במקרה של שגיאת לוגיקה הן מופיעות בקונסול ולא למשתמש.
  function selfTest(){
    const failures=[];const ok=(cond,msg)=>{if(!cond)failures.push(msg)};
    ok(fareForKm(0)===fares[0]&&fareForKm(15)===fares[0],'band 0–15');
    ok(fareForKm(15.001)===fares[1]&&fareForKm(40)===fares[1],'band 15–40');
    ok(fareForKm(40.001)===fares[2]&&fareForKm(75)===fares[2],'band 40–75');
    ok(fareForKm(75.001)===fares[3]&&fareForKm(120)===fares[3],'band 75–120');
    ok(fareForKm(120.001)===fares[4]&&fareForKm(225)===fares[4],'band 120–225');
    ok(fareForKm(225.001)===fares[5],'band 225+');
    ok(zones['99'].size>=730,'area99 list size');ok(zones['901'].size===3,'901 size');ok(zones['902'].size===14,'902 size');ok(zones['903'].size===4,'903 size');
    ['צפת','טבריה','בית שמש','אריאל','נהריה','כרמיאל','נצרת','נוף הגליל','באר שבע','אשקלון','קריית גת','חריש','אום אל־פחם'].forEach(n=>ok(localityToZone.get(canon(n))==='99'||aliases.get(canon(n))==='99',`area99 ${n}`));
    ['תל אביב','ירושלים','חיפה','רעננה','רמת גן','הרצליה'].forEach(n=>ok(!localityToZone.has(canon(n)),`not area1 ${n}`));
    ok(zone1Eligibility({zone:'99'},{zone:'99'},39.9).eligible,'same 99 <=40');ok(!zone1Eligibility({zone:'99'},{zone:'99'},40.1).eligible,'same 99 >40');ok(zone1Eligibility({zone:'901'},{zone:'901'},20).eligible,'same 901');ok(!zone1Eligibility({zone:'901'},{zone:'902'},20).eligible,'cross-zone');
    ok(trunc2(fares[0].price/VAT)>0,'eilat short');ok(trunc2(fares[5].price/VAT)>fares[0].price,'eilat long');
    if(failures.length) console.error('QA failures',failures); else console.info('QA passed: fare boundaries, Area 1 zones and Eilat VAT tests.');
    return failures;
  }
  window.__travelCalcQA=selfTest();
})();
</script>
